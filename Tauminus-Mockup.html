      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

          typeof value === &quot;function&quot; ||

    &quot;message&quot;,

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,

            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

 const terminal=()=&gt;`&lt;div class=&quot;td-terminal&quot;&gt;&lt;div class=&quot;td-cli-title&quot;&gt;✳ Claude Code&lt;/div&gt;&lt;div class=&quot;td-terminal-muted td-small&quot;&gt;Synapse · fix/auth-refresh&lt;/div&gt;&lt;div class=&quot;td-rule&quot;&gt;&lt;/div&gt;&lt;p class=&quot;td-prompt&quot;&gt;❯ Fix token refresh without signing users out.&lt;/p&gt;&lt;p&gt;I traced the refresh flow. Two requests can rotate&lt;br&gt;the same token at once.&lt;/p&gt;&lt;span class=&quot;td-line&quot;&gt;&lt;span class=&quot;td-green&quot;&gt;✓&lt;/span&gt; Read src/auth/session.ts&lt;/span&gt;&lt;span class=&quot;td-line&quot;&gt;&lt;span class=&quot;td-green&quot;&gt;✓&lt;/span&gt; Updated refresh lock and retry handling&lt;/span&gt;&lt;span class=&quot;td-line&quot;&gt;&lt;span class=&quot;td-green&quot;&gt;✓&lt;/span&gt; Added 3 regression tests&lt;/span&gt;&lt;div class=&quot;td-cli-question&quot;&gt;Keep users signed in when the network is offline?&lt;/div&gt;&lt;button class=&quot;td-command-option&quot; data-action=&quot;answer&quot;&gt;❯ 1. Keep the session; retry on reconnect&lt;/button&gt;&lt;button class=&quot;td-command-option&quot; data-action=&quot;answer&quot;&gt;  2. Sign out after the token expires&lt;/button&gt;&lt;div class=&quot;td-terminal-muted td-small&quot; style=&quot;margin-top:12px&quot;&gt;Waiting for your input&lt;/div&gt;&lt;/div&gt;`;
